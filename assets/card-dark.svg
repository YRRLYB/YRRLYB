<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="265" viewBox="0 0 1000 265" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1000" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D101B"/>
      <stop offset="100%" stop-color="#131629"/>
    </linearGradient>
    <linearGradient id="vinyl-label" x1="-30" y1="-30" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="vinyl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .vinyl-spin { animation: spin 7.5s linear infinite; }
    .ring-pulse { animation: wave 3s ease-out infinite; }
    .ring-pulse-2 { animation: wave 3s ease-out 1.5s infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes wave {
      0% { transform: scale(0.86); opacity: 0.7; }
      100% { transform: scale(1.26); opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="998" height="263" rx="18" fill="url(#card-bg)" stroke="#292D47" stroke-width="1.5"/>

  <!-- Left Terminal Pane -->
  <path d="M1 19C1 9.05887 9.05887 1 19 1H640V264H19C9.05887 264 1 255.941 1 246V19Z" fill="#0B0D16" fill-opacity="0.55"/>
  <line x1="640" y1="16" x2="640" y2="249" stroke="#242840" stroke-width="1"/>

  <circle cx="26" cy="24" r="5.5" fill="#F87171"/>
  <circle cx="44" cy="24" r="5.5" fill="#FBBF24"/>
  <circle cx="62" cy="24" r="5.5" fill="#34D399"/>
  <text x="90" y="28" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">profile.ts  —  ~/YRRLYB</text>
  <line x1="18" y1="42" x2="622" y2="42" stroke="#1E2238" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Microsoft YaHei', monospace" font-size="13.5">
    <text x="24" y="72" fill="#475569">01</text>
    <text x="56" y="72"><tspan fill="#C084FC">const </tspan><tspan fill="#E2E8F0">me </tspan><tspan fill="#94A3B8">= </tspan><tspan fill="#F8FAFC">{</tspan></text>

    <text x="24" y="98" fill="#475569">02</text>
    <text x="72" y="98"><tspan fill="#7DD3FC">name</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"YRRLYB"</tspan><tspan fill="#94A3B8">,</tspan></text>

    <text x="24" y="124" fill="#475569">03</text>
    <text x="72" y="124"><tspan fill="#7DD3FC">location</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"你猜我在哪"</tspan><tspan fill="#94A3B8">,</tspan></text>

    <text x="24" y="150" fill="#475569">04</text>
    <text x="72" y="150"><tspan fill="#7DD3FC">building</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FDE68A">"Aria · 多源无损桌面音乐播放器"</tspan><tspan fill="#94A3B8">,</tspan></text>

    <text x="24" y="176" fill="#475569">05</text>
    <text x="72" y="176"><tspan fill="#7DD3FC">focus</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#C4B5FD">["Desktop Audio", "Full-Stack", "ACG / Bots"]</tspan><tspan fill="#94A3B8">,</tspan></text>

    <text x="24" y="202" fill="#475569">06</text>
    <text x="72" y="202"><tspan fill="#7DD3FC">taste</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"界面干净、交互顺手、加一点点动效"</tspan><tspan fill="#94A3B8">,</tspan></text>

    <text x="24" y="228" fill="#475569">07</text>
    <text x="72" y="228"><tspan fill="#7DD3FC">status</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#F9A8D4">"always crafting something fun ♪"</tspan></text>

    <text x="24" y="250" fill="#475569">08</text>
    <text x="56" y="250" fill="#F8FAFC">};</text>
    <rect class="cursor" x="80" y="238" width="8" height="15" rx="1.5" fill="#A78BFA"/>
  </g>

  <!-- Right Spinning Vinyl Section -->
  <g transform="translate(820, 120)">
    <circle cx="0" cy="0" r="105" fill="url(#vinyl-glow)"/>
    <circle class="ring-pulse" cx="0" cy="0" r="76" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle class="ring-pulse-2" cx="0" cy="0" r="76" stroke="#38BDF8" stroke-width="1.5"/>

    <g class="vinyl-spin">
      <circle cx="0" cy="0" r="74" fill="#111320" stroke="#2D3250" stroke-width="2"/>
      <circle cx="0" cy="0" r="64" stroke="#1E2238" stroke-width="1"/>
      <circle cx="0" cy="0" r="54" stroke="#252A44" stroke-width="1" stroke-dasharray="18 10"/>
      <circle cx="0" cy="0" r="44" stroke="#1E2238" stroke-width="1"/>
      <circle cx="0" cy="0" r="34" stroke="#2C3252" stroke-width="1" stroke-dasharray="10 12"/>
      <path d="M-56 -24 A61 61 0 0 1 -22 -57" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 24 A61 61 0 0 1 22 57" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="24" fill="url(#vinyl-label)"/>
      <circle cx="0" cy="0" r="7" fill="#0D101B" stroke="#F8FAFC" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
  </g>

  <text x="820" y="222" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">NOW SPINNING · ARIA</text>
  <text x="820" y="242" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">WASAPI / Hi-Res FLAC  ·  ∞</text>
</svg>
