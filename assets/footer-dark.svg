<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44" fill="none">
  <defs>
    <linearGradient id="rule-left-d" x1="140" y1="0" x2="476" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B949E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8B949E" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rule-right-d" x1="524" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
