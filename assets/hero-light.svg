      <g transform="translate(590, 288)"><rect class="bar b8" x="0" y="-44" width="6" height="44" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(604, 288)"><rect class="bar b5" x="0" y="-56" width="6" height="56" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(618, 288)"><rect class="bar b11" x="0" y="-38" width="6" height="38" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(632, 288)"><rect class="bar b3" x="0" y="-48" width="6" height="48" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(646, 288)"><rect class="bar b9" x="0" y="-32" width="6" height="32" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(660, 288)"><rect class="bar b6" x="0" y="-52" width="6" height="52" rx="3" fill="url(#eq-grad-l)"/></g>
