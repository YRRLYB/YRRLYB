      <g transform="translate(422, 288)"><rect class="bar b9" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(436, 288)"><rect class="bar b5" x="0" y="-48" width="6" height="48" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(450, 288)"><rect class="bar b11" x="0" y="-36" width="6" height="36" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(464, 288)"><rect class="bar b3" x="0" y="-52" width="6" height="52" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(478, 288)"><rect class="bar b8" x="0" y="-38" width="6" height="38" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(492, 288)"><rect class="bar b6" x="0" y="-46" width="6" height="46" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(506, 288)"><rect class="bar b12" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(520, 288)"><rect class="bar b1" x="0" y="-54" width="6" height="54" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(534, 288)"><rect class="bar b10" x="0" y="-40" width="6" height="40" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(548, 288)"><rect class="bar b4" x="0" y="-50" width="6" height="50" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(562, 288)"><rect class="bar b7" x="0" y="-34" width="6" height="34" rx="3" fill="url(#eq-grad-l)"/></g>
