      <g transform="translate(702, 288)"><rect class="bar b10" x="0" y="-28" width="6" height="28" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(716, 288)"><rect class="bar b4" x="0" y="-46" width="6" height="46" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(730, 288)"><rect class="bar b7" x="0" y="-34" width="6" height="34" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(744, 288)"><rect class="bar b2" x="0" y="-42" width="6" height="42" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(758, 288)"><rect class="bar b8" x="0" y="-26" width="6" height="26" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(772, 288)"><rect class="bar b5" x="0" y="-36" width="6" height="36" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(786, 288)"><rect class="bar b11" x="0" y="-22" width="6" height="22" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(800, 288)"><rect class="bar b3" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(814, 288)"><rect class="bar b6" x="0" y="-18" width="6" height="18" rx="3" fill="url(#eq-grad-l)"/></g>
      <g transform="translate(828, 288)"><rect class="bar b9" x="0" y="-22" width="6" height="22" rx="3" fill="url(#eq-grad-l)"/></g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="308" rx="22" stroke="#DDD6FE" stroke-width="1.5"/>
