<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44" fill="none">
  <defs>
    <linearGradient id="rule-left-l" x1="140" y1="0" x2="476" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#656D76" stop-opacity="0"/>
      <stop offset="100%" stop-color="#656D76" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rule-right-l" x1="524" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#656D76" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#656D76" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .note { animation: notePulse 3.6s ease-in-out infinite; }
    @keyframes notePulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
  <line x1="140" y1="22" x2="476" y2="22" stroke="url(#rule-left-l)" stroke-width="1"/>
  <text class="note" x="500" y="27" text-anchor="middle" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">♪</text>
  <line x1="524" y1="22" x2="860" y2="22" stroke="url(#rule-right-l)" stroke-width="1"/>
</svg>
