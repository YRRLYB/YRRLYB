<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090B12"/>
      <stop offset="50%" stop-color="#0F1122"/>
      <stop offset="100%" stop-color="#090C16"/>
    </linearGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect x="1" y="1" width="1198" height="308" rx="22"/>
    </clipPath>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#A5B4FC" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    .orb1 { animation: float1 14s ease-in-out infinite; }
    .orb2 { animation: float2 18s ease-in-out infinite; }
    .orb3 { animation: float3 12s ease-in-out infinite; }
    .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }
    .star { animation: twinkle 3.6s ease-in-out infinite; }
    .s2 { animation-delay: 0.9s; }
    .s3 { animation-delay: 1.8s; }
    .s4 { animation-delay: 2.5s; }
    .ring-rot { animation: slowSpin 38s linear infinite; }
    .bar { transform-origin: 0px 0px; animation: eqBounce 1.15s ease-in-out infinite; }
    .b1  { animation-delay: 0.00s; animation-duration: 1.05s; }
    .b2  { animation-delay: 0.12s; animation-duration: 1.25s; }
    .b3  { animation-delay: 0.24s; animation-duration: 0.95s; }
    .b4  { animation-delay: 0.36s; animation-duration: 1.35s; }
    .b5  { animation-delay: 0.18s; animation-duration: 1.10s; }
    .b6  { animation-delay: 0.42s; animation-duration: 0.90s; }
    .b7  { animation-delay: 0.55s; animation-duration: 1.30s; }
    .b8  { animation-delay: 0.08s; animation-duration: 1.15s; }
    .b9  { animation-delay: 0.30s; animation-duration: 1.00s; }
    .b10 { animation-delay: 0.48s; animation-duration: 1.22s; }
    .b11 { animation-delay: 0.15s; animation-duration: 0.92s; }
    .b12 { animation-delay: 0.62s; animation-duration: 1.18s; }

    @keyframes float1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 28px) scale(1.08); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-70px, -24px) scale(1.1); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0px, 0px); opacity: 0.8; }
      50% { transform: translate(35px, -30px); opacity: 1; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes eqBounce {
      0%, 100% { transform: scaleY(0.28); }
      35% { transform: scaleY(1.00); }
      70% { transform: scaleY(0.48); }
    }
  </style>

  <g clip-path="url(#frame-clip)">
    <rect width="1200" height="310" fill="url(#bg-dark)"/>
    <rect width="1200" height="310" fill="url(#dots)"/>

    <!-- Drifting Aurora Orbs -->
    <g class="orb1"><circle cx="240" cy="70" r="240" fill="url(#orb-purple)"/></g>
    <g class="orb2"><circle cx="960" cy="240" r="260" fill="url(#orb-cyan)"/></g>
    <g class="orb3"><circle cx="620" cy="30" r="190" fill="url(#orb-pink)"/></g>

    <!-- Orbital Accent Ring -->
    <g transform="translate(600, 155)">
      <g class="ring-rot">
        <ellipse cx="0" cy="0" rx="340" ry="96" stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="6 8"/>
      </g>
    </g>

    <!-- Twinkling Stars -->
    <circle class="star" cx="148" cy="112" r="1.8" fill="#E0E7FF"/>
    <circle class="star s2" cx="290" cy="215" r="1.5" fill="#7DD3FC"/>
    <circle class="star s3" cx="930" cy="96" r="2" fill="#F9A8D4"/>
    <circle class="star s4" cx="1055" cy="186" r="1.6" fill="#C4B5FD"/>
    <circle class="star s2" cx="440" cy="58" r="1.4" fill="#E0E7FF"/>
    <circle class="star s3" cx="775" cy="245" r="1.5" fill="#A5B4FC"/>

    <!-- Top Badges -->
    <g transform="translate(28, 24)">
      <rect width="176" height="28" rx="14" fill="#14182B" fill-opacity="0.88" stroke="#8B5CF6" stroke-opacity="0.35"/>
      <circle class="pulse-dot" cx="16" cy="14" r="4" fill="#34D399"/>
      <text x="28" y="18" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">~/YRRLYB · ONLINE</text>
    </g>
    <g transform="translate(966, 24)">
      <rect width="206" height="28" rx="14" fill="#14182B" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="103" y="18" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600">AUDIO · FULL-STACK · ACG</text>
    </g>

    <!-- Main Hero Typography -->
    <text x="600" y="138" text-anchor="middle" fill="url(#title-grad)" filter="url(#glow-soft)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="10">YRRLYB</text>
    <text x="600" y="176" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="500" letter-spacing="1.5">折腾音乐、代码与一切顺眼的小玩意 ♪</text>

    <!-- Tech Focus Pill Row -->
    <g transform="translate(362, 198)">
      <rect width="476" height="26" rx="13" fill="#14182B" fill-opacity="0.72" stroke="#6366F1" stroke-opacity="0.25"/>
      <text x="238" y="17" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="0.8">Hi-Res Audio  ·  Electron &amp; React  ·  TypeScript  ·  Creative Tools</text>
    </g>

    <!-- Animated Hi-Fi Audio Spectrum Bars -->
    <g opacity="0.85">
      <g transform="translate(366, 288)"><rect class="bar b1" x="0" y="-22" width="6" height="22" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(380, 288)"><rect class="bar b4" x="0" y="-34" width="6" height="34" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(394, 288)"><rect class="bar b7" x="0" y="-26" width="6" height="26" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(408, 288)"><rect class="bar b2" x="0" y="-42" width="6" height="42" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(422, 288)"><rect class="bar b9" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(436, 288)"><rect class="bar b5" x="0" y="-48" width="6" height="48" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(450, 288)"><rect class="bar b11" x="0" y="-36" width="6" height="36" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(464, 288)"><rect class="bar b3" x="0" y="-52" width="6" height="52" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(478, 288)"><rect class="bar b8" x="0" y="-38" width="6" height="38" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(492, 288)"><rect class="bar b6" x="0" y="-46" width="6" height="46" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(506, 288)"><rect class="bar b12" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(520, 288)"><rect class="bar b1" x="0" y="-54" width="6" height="54" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(534, 288)"><rect class="bar b10" x="0" y="-40" width="6" height="40" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(548, 288)"><rect class="bar b4" x="0" y="-50" width="6" height="50" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(562, 288)"><rect class="bar b7" x="0" y="-34" width="6" height="34" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(576, 288)"><rect class="bar b2" x="0" y="-56" width="6" height="56" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(590, 288)"><rect class="bar b8" x="0" y="-44" width="6" height="44" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(604, 288)"><rect class="bar b5" x="0" y="-56" width="6" height="56" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(618, 288)"><rect class="bar b11" x="0" y="-38" width="6" height="38" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(632, 288)"><rect class="bar b3" x="0" y="-48" width="6" height="48" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(646, 288)"><rect class="bar b9" x="0" y="-32" width="6" height="32" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(660, 288)"><rect class="bar b6" x="0" y="-52" width="6" height="52" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(674, 288)"><rect class="bar b12" x="0" y="-36" width="6" height="36" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(688, 288)"><rect class="bar b1" x="0" y="-44" width="6" height="44" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(702, 288)"><rect class="bar b10" x="0" y="-28" width="6" height="28" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(716, 288)"><rect class="bar b4" x="0" y="-46" width="6" height="46" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(730, 288)"><rect class="bar b7" x="0" y="-34" width="6" height="34" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(744, 288)"><rect class="bar b2" x="0" y="-42" width="6" height="42" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(758, 288)"><rect class="bar b8" x="0" y="-26" width="6" height="26" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(772, 288)"><rect class="bar b5" x="0" y="-36" width="6" height="36" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(786, 288)"><rect class="bar b11" x="0" y="-22" width="6" height="22" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(800, 288)"><rect class="bar b3" x="0" y="-30" width="6" height="30" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(814, 288)"><rect class="bar b6" x="0" y="-18" width="6" height="18" rx="3" fill="url(#eq-grad)"/></g>
      <g transform="translate(828, 288)"><rect class="bar b9" x="0" y="-22" width="6" height="22" rx="3" fill="url(#eq-grad)"/></g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="308" rx="22" stroke="url(#border-grad)" stroke-width="1.5"/>
</svg>
